[versions]
androidGradle = "8.3.1"
kotlin = "2.0.21"
core = "1.13.1"
material = "1.13.0"
composeBom = "2024.06.00"
lifecycleRuntimeCompose = "2.7.0"
navigationCompose = "2.7.7"
androidxHilt = "1.2.0"
documentFile = "1.0.1"
coroutines = "1.7.3"

# square
moshi = "1.15.0"
retrofit2 = "2.9.0"
okhttp3 = "4.12.0"

# KSP
ksp = "2.0.21-1.0.26"
materialVersion = "1.10.0"

# DataStore
cryptoPreferenceDatastore = "1.0.0-beta01"

# Json
jsonSerialization = "1.6.3"

# etc
hilt = "2.51.1"
gson = "2.10"
timber = "5.0.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
coil = "2.5.0"

# AWS
aws = "2.81.1"

# Markdown
richtext = "1.0.0-alpha03"

[libraries]
# androidX
## Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material = { module = "androidx.compose.material:material" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
material = { group = "com.google.android.material", name = "material", version.ref = "materialVersion" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core" }

## hilt
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
document-file = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }

# square
## moshi
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
moshi-kotlin-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
moshi-adapters = { module = "com.squareup.moshi:moshi-adapters", version.ref = "moshi" }

## retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit2" }
retrofit-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit2" }
retrofit-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit2" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit2" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson"}

## okhttp3
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3" }
okhttp3-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp3" }
okhttp3-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp3" }

crypto-datastore-preferences = { module = "io.github.osipxd:security-crypto-datastore-preferences", version.ref = "cryptoPreferenceDatastore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
json-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "jsonSerialization" }

# AWS
aws-core = { module = "com.amazonaws:aws-android-sdk-core", version.ref = "aws" }
aws-dynamodb = { module = "com.amazonaws:aws-android-sdk-ddb", version.ref = "aws" }
aws-dynamodb-mapper = { module = "com.amazonaws:aws-android-sdk-ddb-mapper", version.ref = "aws" }

# Markdown
richtext-ui-m3 = { group = "com.halilibo.compose-richtext", name = "richtext-ui-material3", version.ref = "richtext" }
richtext-parser-commonmark = { group = "com.halilibo.compose-richtext", name = "richtext-commonmark", version.ref = "richtext" }

# etc
## coil
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

[bundles]
hilt = ["hilt-work", "hilt-navigation-compose", "hilt"]
hilt-ksp = ["androidx-hilt-compiler", "hilt-compiler"]
retrofit = ["retrofit", "retrofit-moshi", "retrofit-scalars", "retrofit-gson"]
aws = ["aws-core", "aws-dynamodb", "aws-dynamodb-mapper"]
richtext = ["richtext-ui-m3", "richtext-parser-commonmark"]
coil = ["coil", "coil-compose"]


[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradle" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "androidGradle" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }